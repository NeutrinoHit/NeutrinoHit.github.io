lang: ru-RU

project:
  type: website
  post-render:
    - python scripts/validate_reveal_context_homes.py
  resources:
    - "/assets/**"
    - "/qr/**"
    - "/students/theses/**"
    - "/theses/**"
    - "/en/cv.pdf"
    - "/ru/cv.pdf"
  render:
    - "index.qmd"
    - "ru/*.qmd"
    - "en/*.qmd"
    - "ru/courses/*.qmd"
    - "ru/interviews/*.qmd"
    - "en/courses/*.qmd"
    - "albums/**/*.qmd"
    - "!obsolete/**/*.qmd"
    - "!photo-studio.qmd"

website:
  title: "NeutrinoHit"
  site-url: "https://neutrinohit.github.io/"
  repo-url: "https://github.com/NeutrinoHit/NeutrinoHit.github.io"
  navbar:
    # The globe logo of the QR codes (assets/site/neutrinohit-logo.png, 192 px, cut from assets/books/qr_center_logo_globe_bw.png)
    logo: /assets/site/neutrinohit-logo.png
    logo-alt: "NeutrinoHit"
    left:
      - href: ru/index.qmd
        text: Главная
      - href: ru/research.qmd
        text: Наука
      - href: ru/education.qmd
        text: Образование
      - href: ru/materials.qmd
        text: Книги
      - href: ru/modeling.qmd
        text: Моделирование
      - href: ru/animations.qmd
        text: Анимации
      - href: ru/interactives.qmd
        text: Интерактивы
      - href: ru/school.qmd
        text: Школа
      # Second row on wide screens (styles.css, "Navbar in two rows"): the sections for a broad audience.
      - href: ru/outreach.qmd
        text: Научная коммуникация
      - href: ru/cinema.qmd
        text: Кино
      - href: ru/interviews.qmd
        text: Интервью и подкасты
      - href: ru/photos.qmd
        text: Фото
    right:
      - href: ru/index.qmd
        text: RU
      - href: en/index.qmd
        text: EN
  page-footer:
    left: "© NeutrinoHit"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    toc: true
    css:
      - assets/site/neutrinohit-tokens.css
      - assets/site/neutrinohit-base.css
      - assets/site/neutrinohit-components.css
      - assets/site/neutrinohit-projects.css
      - styles.css
    include-after-body:
      - album-lightbox.html
      - assets/local-preview-links.html
      - assets/site/language-tools.html
      - analytics/cloudflare-web-analytics.html
