project:
  type: website
  post-render:
    - python scripts/sync_local_project_sites.py
  resources:
    - "assets/**"
    - "students/theses/**"
    - "theses/**"
  render:
    - "*.qmd"
    - "albums/**/*.qmd"
    - "!photo-studio.qmd"

website:
  title: "NeutrinoHit"
  site-url: "https://neutrinohit.github.io/"
  repo-url: "https://github.com/NeutrinoHit/NeutrinoHit.github.io"
  navbar:
    left:
      - href: index.qmd
        text: Главная
      - href: books.qmd
        text: Книги
      - href: lectures.qmd
        text: Лекции
      - href: students.qmd
        text: Студенты
      - href: theses.qmd
        text: Диссертации
      - href: schools.qmd
        text: Школы
      - href: talks.qmd
        text: Доклады
      - href: interviews.qmd
        text: Интервью
      - href: photos.qmd
        text: Фото
      - href: https://neutrinohit.github.io/sciencepop/
        text: Научпоп
      - href: cinema.qmd
        text: Мое кино
      - href: animations.qmd
        text: Анимации
      - href: software.qmd
        text: Код
  page-footer:
    left: "© NeutrinoHit"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    toc: true
    lang: ru
    css:
      - assets/site/neutrinohit-tokens.css
      - assets/site/neutrinohit-base.css
      - assets/site/neutrinohit-components.css
      - assets/site/neutrinohit-projects.css
      - styles.css
    include-after-body:
      - album-lightbox.html
      - assets/local-preview-links.html
      - analytics/cloudflare-web-analytics.html
