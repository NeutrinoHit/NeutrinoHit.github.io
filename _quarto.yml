project:
  type: website
  post-render:
    - python scripts/sync_local_project_sites.py
  resources:
    - "assets/**"
    - "students/theses/**"
    - "theses/**"
  render:
    - "*.qmd"
    - "albums/**/*.qmd"
    - "!photo-studio.qmd"

website:
  title: "NeutrinoHit"
  site-url: "https://neutrinohit.github.io/"
  repo-url: "https://github.com/NeutrinoHit/NeutrinoHit.github.io"
  navbar:
    left:
      - href: index.qmd
        text: Главная
      - href: research.qmd
        text: Наука
      - href: education.qmd
        text: Образование
      - href: outreach.qmd
        text: Научная коммуникация
      - href: materials.qmd
        text: Материалы
      - href: people.qmd
        text: Люди
      - href: about.qmd
        text: Обо мне
  page-footer:
    left: "© NeutrinoHit"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    toc: true
    lang: ru
    css:
      - assets/site/neutrinohit-tokens.css
      - assets/site/neutrinohit-base.css
      - assets/site/neutrinohit-components.css
      - assets/site/neutrinohit-projects.css
      - styles.css
    include-after-body:
      - album-lightbox.html
      - assets/local-preview-links.html
      - analytics/cloudflare-web-analytics.html
