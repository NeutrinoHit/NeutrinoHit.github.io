# Lecture courses shown on the site. scripts/build_course_pages.py writes ru|en/education.qmd and ru|en/courses/*.qmd from this file.
# Paths starting with "/" are site paths on neutrinohit.github.io; a key ending in "_en" overrides its key on English pages.
education:
  title: {ru: Образование, en: Education}
  lead: {ru: 'Курсы лекций, образовательные программы и материалы для самостоятельной работы по КТП, физике нейтрино и частиц, статистическому анализу данных.', en: 'Lecture courses, educational programs and self-study materials on QFT, neutrino and particle
      physics, and statistical data analysis.'}
  sections:
  - id: qft
    title: {ru: Квантовая теория поля, en: Quantum Field Theory}
    line:
      text: {ru: 'Учебник к курсам:', en: 'Textbook for the courses:'}
      label: {ru: «Квантовая теория поля для экспериментаторов и не только» →, en: “Quantum Field Theory for Experimentalists and Beyond” (in Russian) →}
      href: /ru/materials.html#qft-book
      href_en: /en/materials.html#qft-book
    courses: [quantum-field-theory, standard-model, qft-renormalization, unruh, qft-attraction-repulsion, qft-vacuum]
    # tiles of pages that are not lecture courses: kind, title, text, href (href_en), meta
    tiles:
    - anchor: qft-exams
      kind: {ru: Экзамен · проекты, en: Exam · projects}
      title: {ru: Экзаменационные проекты по КТП, en: Examination projects in QFT}
      text: {ru: 'Мини-проекты вместо билетов: теория, расчёт, моделирование и сравнение с экспериментом.', en: 'Mini-projects instead of exam questions: theory, calculation, simulation and comparison with experiment.'}
      href: /ru/qft-exams.html
      href_en: /en/qft-exams.html
      meta: {ru: Осень · 20 проектов · весна · 18 проектов, en: Autumn · 20 projects · spring · 18 projects}
    - anchor: qft-faq
      kind: {ru: ЧАВО, en: FAQ}
      title: {ru: ЧАВО по КТП, en: QFT FAQ}
      text: {ru: 'Концептуальные вопросы: поле или частица, точечна ли частица, кипит ли вакуум, что такое виртуальная частица.', en: 'Conceptual questions: field or particle, is a particle pointlike, does the vacuum boil, what is a virtual particle.'}
      href: /ru/qft-faq.html
      href_en: /en/qft-faq.html
      meta: {ru: 9 вопросов · ответы пополняются, en: 9 questions · answers are being added}
  - id: stat
    title: {ru: Статистический анализ данных, en: Statistical Data Analysis}
    courses: [statistical-analysis]
  - id: neutrino
    title: {ru: Физика нейтрино, en: Neutrino Physics}
    courses: [neutrino-introduction, oscillations-minicourse, solar-neutrino-masterclass, neutrino-oscillation-theory]
  - id: particles
    title: {ru: Физика элементарных частиц, en: Particle Physics}
    courses: [particle-physics-baikal, particle-physics]
  - id: more
    title: {ru: Другие курсы, en: More courses}
    courses: [gravity, light-propagation, numerical-methods]
