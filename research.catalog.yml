# Research. scripts/build_outreach_pages.py writes ru|en/research.qmd from this file
# (same entries, links and formats as outreach.catalog.yml; a group may also hold tiles).
# Publications with the INSPIRE metrics of the home page, experiments, scientific software, theses.
# Talks and lectures are on the "Lectures and talks" page (talks in outreach.catalog.yml).
# The old Modeling page (modeling.html) redirects here; the anchors lighthit, tdse-diffraction and
# neutrino-nucleus-coherence are kept.
research:
  title: {ru: Наука, en: Research}
  aliases: [modeling.html, theses.html]
  lead: {ru: 'Нейтринная физика и астрофизика частиц: нейтринные осцилляции, реакторные и солнечные нейтрино, нейтринная астрономия, космические лучи, физика детекторов, квантово-полевое описание нейтринных процессов.',
    en: 'Neutrino physics and astroparticle physics: neutrino oscillations, reactor and solar neutrinos, neutrino astronomy, cosmic rays, detector physics, and quantum-field descriptions of neutrino processes.'}
  groups:
  - id: research-profile
    kind: {ru: INSPIRE-HEP, en: INSPIRE-HEP}
    title: {ru: Публикации, en: Publications}
    links:
    - {kind: site, label: {ru: Статьи в INSPIRE-HEP, en: Papers in INSPIRE-HEP}, href: 'https://inspirehep.net/authors/1048243?ui-citation-summary=true'}
    - {kind: site, label: {ru: Профиль в ОИЯИ, en: JINR profile}, href: 'https://naumov.jinr.ru/'}
    metrics: inspire
  - id: experiments
    kind: {ru: Коллаборации, en: Collaborations}
    title: {ru: Эксперименты, en: Experiments}
    tiles:
    - status: {ru: Нейтринный телескоп, en: Neutrino telescope}
      title: Baikal-GVD
      href: 'https://baikalgvd.jinr.ru/'
      text: {ru: 'Глубоководный нейтринный телескоп в озере Байкал.', en: 'A deep-water neutrino telescope in Lake Baikal.'}
    - status: {ru: Реакторные нейтрино, en: Reactor neutrinos}
      title: JUNO
      href: 'https://juno.ihep.ac.cn/'
      text: {ru: 'Жидкосцинтилляционный детектор в Китае: порядок масс и точные параметры осцилляций.', en: 'A liquid-scintillator detector in China: the mass ordering and precise oscillation parameters.'}
    - status: {ru: Реакторные нейтрино, en: Reactor neutrinos}
      title: Daya Bay
      href: 'https://dayabay.bnl.gov/'
      text: {ru: 'Измерение угла смешивания θ₁₃ на реакторных антинейтрино.', en: 'The measurement of the mixing angle θ₁₃ with reactor antineutrinos.'}
    - status: {ru: Ускорительные нейтрино, en: Accelerator neutrinos}
      title: OPERA
      href: 'https://opendata.cern/docs/about-opera'
      text: {ru: 'Появление тау-нейтрино в пучке мюонных нейтрино из ЦЕРН в Гран-Сассо.', en: 'The appearance of tau neutrinos in the muon-neutrino beam from CERN to Gran Sasso.'}
    - status: {ru: Ускорительные нейтрино, en: Accelerator neutrinos}
      title: NOMAD
      href: 'https://greybook.cern.ch/experiment/detail?id=NOMAD'
      text: {ru: 'Нейтринные взаимодействия в пучке SPS ЦЕРН.', en: 'Neutrino interactions in the CERN SPS beam.'}
    - status: {ru: Космические лучи, en: Cosmic rays}
      title: EUSO / JEM-EUSO
      href: 'https://jemeuso.riken.jp/en/'
      text: {ru: 'Космические лучи предельно высоких энергий: наблюдение с орбиты.', en: 'Ultra-high-energy cosmic rays observed from orbit.'}
  - id: modeling
    kind: {ru: Программы и модели, en: Software and models}
    title: {ru: Моделирование, en: Modeling}
    layout: stacked
    items:
    - id: lighthit
      title: LightHit
      note: {ru: 'пакет Python на PyPI: ожидаемое число фотоэлектронов в каждом оптическом модуле нейтринного телескопа по временным бинам от черенковского света заряженных частиц или калибровочной вспышки; спектральный перенос излучения вместо пофотонного Монте-Карло, прямой, однократно и многократно рассеянный свет отдельно. Python 3.11 или новее, проверка установки — lighthit-selftest',
        en: 'a Python package on PyPI: the expected number of photoelectrons that Cherenkov light of charged particles, or a calibration flash, produces in every optical module of a neutrino telescope, per time bin; spectral radiative transfer instead of photon-by-photon Monte Carlo, direct, once-scattered and multiply scattered light kept separate. Python 3.11 or newer; check the installation with lighthit-selftest'}
      install: "python -m pip install 'lighthit[accelerate]'"
      links:
      - {kind: pypi, href: 'https://pypi.org/project/lighthit/'}
      - {kind: docs, href: 'https://github.com/NeutrinoHit/LightHit/tree/main/docs'}
      - {kind: code, href: 'https://github.com/NeutrinoHit/LightHit'}
    - id: tdse-diffraction
      title: TDSE-Diffraction
      note: {ru: 'дифракция электронов: метод split-step Фурье в единицах СИ, вихревые пучки, ноутбуки с анимациями', en: 'electron diffraction: split-step Fourier method in SI units, vortex beams, notebooks with animations'}
      links: [{kind: code, href: 'https://github.com/NeutrinoHit/TDSE-Diffraction'}]
    - id: neutrino-nucleus-coherence
      title: neutrino-nucleus-coherence
      note: {ru: 'сечение упругого рассеяния нейтрино на ядре, ноутбук Jupyter', en: 'the cross-section of neutrino–nucleus elastic scattering, a Jupyter notebook'}
      links: [{kind: code, href: 'https://github.com/NeutrinoHit/neutrino-nucleus-coherence'}]
  - id: theses
    kind: {ru: Квалификационные работы, en: Qualification works}
    title: {ru: Диссертации, en: Theses}
    summary: {ru: '', en: 'The PDF files are in Russian.'}
    layout: stacked
    items:
    - title: {ru: 'Измерение θ₁₃, Δm²₃₂ и ковариантная квантово-полевая теория нейтринных осцилляций', en: 'Measurement of θ₁₃, Δm²₃₂, and covariant quantum-field theory of neutrino oscillations'}
      note: {ru: 2017 · докторская диссертация, en: 2017 · doctoral dissertation}
      links: [{kind: pdf, href: /media-research/dn-theses/doctoral-v1.pdf}]
    - title: {ru: 'Рождение странных адронов и измерение поляризации лямбда- и антилямбда-гиперонов в нейтринных взаимодействиях в эксперименте NOMAD в ЦЕРНе', en: 'Strange-hadron production and measurement of lambda and anti-lambda hyperon polarization in neutrino interactions in the NOMAD experiment at CERN'}
      note: {ru: 2001 · кандидатская диссертация, en: 2001 · candidate dissertation}
      links: [{kind: pdf, href: /media-research/dn-theses/candidate-v1.pdf}]
    - title: {ru: 'Ядерные переходы ¹⁶O + H → ¹⁷F и эффекты электронного экранирования', en: 'Nuclear transitions ¹⁶O + H → ¹⁷F and electron-screening effects'}
      note: {ru: '1997 · дипломная работа, ИГУ', en: '1997 · diploma thesis, Irkutsk State University'}
      links: [{kind: pdf, href: /media-research/dn-theses/diploma-v1.pdf}]
