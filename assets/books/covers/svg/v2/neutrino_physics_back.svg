<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="210mm" height="297mm"
     viewBox="0 0 210 297"
     role="img" aria-labelledby="document-title document-description">
  <title id="document-title">Введение в физику нейтрино — задняя обложка</title>
  <desc id="document-description">Цельная аннотация, авторский блок с регалиями и международными наградами, светлый логотип NeutrinoHit.</desc>
  <metadata>Working A4 format with live text. The copy describes the planned complete book of 35 chapters in 10 parts. Both international awards are attributed to the author as a member of the Daya Bay collaboration. Credentials checked against the author CV and official JINR profile.</metadata>
  
<rect width="210" height="297" fill="#07131B"/>
<g id="back-cover-star-field"><circle cx="204.00" cy="201.00" r="0.45" fill="#F3E9D4" opacity="0.45"/><circle cx="12.00" cy="234.00" r="0.45" fill="#F3E9D4" opacity="0.27"/><circle cx="28.00" cy="31.00" r="0.45" fill="#F3E9D4" opacity="0.54"/><circle cx="202.00" cy="191.00" r="0.27" fill="#9CDBE6" opacity="0.27"/><circle cx="122.00" cy="9.00" r="0.36" fill="#F3E9D4" opacity="0.36"/><circle cx="14.00" cy="113.00" r="0.27" fill="#F3E9D4" opacity="0.18"/><circle cx="192.00" cy="133.00" r="0.45" fill="#F3E9D4" opacity="0.27"/><circle cx="182.00" cy="60.00" r="0.27" fill="#F3E9D4" opacity="0.27"/><circle cx="202.00" cy="124.00" r="0.36" fill="#F3E9D4" opacity="0.27"/><path d="M 200.90 124.00 H 203.10 M 202.00 122.90 V 125.10" fill="none" stroke="#F3E9D4" stroke-width="0.18" opacity="0.48"/><circle cx="72.00" cy="9.00" r="0.45" fill="#F3E9D4" opacity="0.36"/><circle cx="14.00" cy="31.00" r="0.36" fill="#F3E9D4" opacity="0.18"/><circle cx="182.00" cy="195.00" r="0.27" fill="#F3E9D4" opacity="0.36"/><circle cx="184.00" cy="71.00" r="0.18" fill="#F3E9D4" opacity="0.18"/><circle cx="184.00" cy="73.00" r="0.45" fill="#9CDBE6" opacity="0.45"/></g>
<rect x="190" y="0" width="20" height="297" fill="#0A5965"/>
<rect x="187.4" y="0" width="2.6" height="297" fill="#57B9CF"/>
<text x="22.00" y="48.00" font-family="PT Serif" font-size="10.30" font-weight="400" fill="#F2E9D8" text-anchor="start" letter-spacing="-0.10"><tspan x="22.00" dy="0.00">От квантового состояния</tspan><tspan x="22.00" dy="12.40">к экспериментальному</tspan><tspan x="22.00" dy="12.40">открытию</tspan></text>
<path d="M 22 88 H 43" stroke="#F6CA77" stroke-width="0.6"/>
<g id="editorial-blurb"><text x="22.00" y="100.00" font-family="Arial" font-size="3.90" font-weight="400" fill="#F2E9D8" text-anchor="start"><tspan x="22.00" dy="0.00">Нейтрино связывают физику элементарных частиц с жизнью звёзд и историей</tspan><tspan x="22.00" dy="6.10">Вселенной. Их изучение начинается с вопросов о массе, спине и взаимодействии</tspan><tspan x="22.00" dy="6.10">с веществом — и приводит к границам наших знаний о природе.</tspan></text><text x="22.00" y="121.40" font-family="Arial" font-size="3.90" font-weight="400" fill="#F2E9D8" text-anchor="start"><tspan x="22.00" dy="0.00">В этой книге теория и эксперимент образуют единый рассказ. От физических</tspan><tspan x="22.00" dy="6.10">принципов и квантовых амплитуд читатель приходит к устройству установки,</tspan><tspan x="22.00" dy="6.10">наблюдаемому сигналу и смыслу измеренного результата. Осцилляции, природа</tspan><tspan x="22.00" dy="6.10">массы, нейтрино Солнца, Земли и космоса рассматриваются во взаимосвязи;</tspan><tspan x="22.00" dy="6.10">установленные факты служат опорой для обсуждения открытых вопросов.</tspan></text><text x="22.00" y="155.00" font-family="Arial" font-size="3.90" font-weight="400" fill="#F2E9D8" text-anchor="start"><tspan x="22.00" dy="0.00">Книга опирается на опыт автора в теоретических исследованиях и нейтринных</tspan><tspan x="22.00" dy="6.10">экспериментах. Поэтому внимание уделено и тому, как получить формулу, и тому,</tspan><tspan x="22.00" dy="6.10">при каких условиях она описывает измерение: роли приближений, отклика</tspan><tspan x="22.00" dy="6.10">детектора и неопределённостей. Подробные выводы, задачи и наглядные модели</tspan><tspan x="22.00" dy="6.10">помогают освоить физику нейтрино как область самостоятельного исследования.</tspan></text></g>
<text x="22" y="191" font-family="Arial" font-size="3.0" fill="#A8BDC2">Для студентов, аспирантов и исследователей.</text>
<line x1="22" y1="201" x2="173" y2="201" stroke="#35505A" stroke-width="0.35"/>
<g id="author-credentials">
  <text x="22" y="212" font-family="PT Serif" font-size="5.2" fill="#F2E9D8">Дмитрий В. Наумов</text>
  <text x="22.00" y="220.00" font-family="Arial" font-size="3.25" font-weight="400" fill="#A8BDC2" text-anchor="start"><tspan x="22.00" dy="0.00">Доктор физико-математических наук, физик-теоретик и экспериментатор. Заместитель директора</tspan><tspan x="22.00" dy="4.80">ЛЯП ОИЯИ, руководитель Нейтринной программы ОИЯИ.</tspan></text>
  <text x="22" y="237" font-family="Arial" font-size="3.1" fill="#A8BDC2">Лауреат международных премий в составе коллаборации Daya Bay</text>
  <g id="author-awards"><text x="22" y="246.0" font-family="Arial" font-size="3.15" fill="#F6CA77">2016</text><text x="37" y="246.0" font-family="Arial" font-size="3.3" fill="#F2E9D8">Breakthrough Prize in Fundamental Physics</text><text x="22" y="252.5" font-family="Arial" font-size="3.15" fill="#F6CA77">2023</text><text x="37" y="252.5" font-family="Arial" font-size="3.3" fill="#F2E9D8">Премия Европейского физического общества</text></g>
</g>
