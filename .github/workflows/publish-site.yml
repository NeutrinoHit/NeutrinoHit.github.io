name: Publish site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

env:
  GTRACKER_SHEET_ID: ${{ secrets.GTRACKER_SHEET_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Check out gTracker
        if: env.GTRACKER_SHEET_ID != ''
        uses: actions/checkout@v4
        with:
          repository: NeutrinoHit/gTracker
          path: _gtracker

      - name: Set up Python for gTracker
        if: env.GTRACKER_SHEET_ID != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gTracker dependencies
        if: env.GTRACKER_SHEET_ID != ''
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r _gtracker/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build Teach-in applications map
        if: env.GTRACKER_SHEET_ID != ''
        env:
          GTRACKER_SERVICE_ACCOUNT_JSON: ${{ secrets.GTRACKER_SERVICE_ACCOUNT_JSON }}
          GTRACKER_GID: ${{ vars.GTRACKER_GID }}
          GTRACKER_WORKSHEET: ${{ vars.GTRACKER_WORKSHEET }}
        run: |
          set -euo pipefail
          mkdir -p _site/assets/programs "${RUNNER_TEMP}/gtracker-frames"
          service_account_args=()
          if [ -n "${GTRACKER_SERVICE_ACCOUNT_JSON:-}" ]; then
            service_account_file="${RUNNER_TEMP}/gtracker-service-account.json"
            printf '%s' "${GTRACKER_SERVICE_ACCOUNT_JSON}" > "${service_account_file}"
            service_account_args=(--service-account "${service_account_file}")
          fi
          sheet_gid="${GTRACKER_GID:-0}"
          worksheet="${GTRACKER_WORKSHEET:-Заявки}"
          python _gtracker/scripts/build_from_google.py \
            --sheet-id "${GTRACKER_SHEET_ID}" \
            --gid "${sheet_gid}" \
            --worksheet "${worksheet}" \
            "${service_account_args[@]}" \
            --scope russia \
            --download-map \
            --geocode-missing \
            --no-gif \
            --frames "${RUNNER_TEMP}/gtracker-frames" \
            --mp4 _site/assets/programs/teach-in-applications-map.mp4 \
            --date-mode events \
            --mp4-fps 2 \
            --hold-first 2 \
            --hold-last 10 \
            --label-top 8 \
            --network-neighbors 1
          ffmpeg -y -ss 7 -i _site/assets/programs/teach-in-applications-map.mp4 \
            -frames:v 1 "${RUNNER_TEMP}/teach-in-applications-map-poster.png"
          ffmpeg -y -i "${RUNNER_TEMP}/teach-in-applications-map-poster.png" \
            -frames:v 1 -q:v 3 _site/assets/programs/teach-in-applications-map-poster.jpg

      - name: Publish rendered site to gh-pages
        run: |
          set -euo pipefail
          site_dir="${RUNNER_TEMP}/neutrinohit-site"
          rm -rf "${site_dir}"
          mkdir -p "${site_dir}"
          cp -R _site/. "${site_dir}/"
          touch "${site_dir}/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-deploy
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp -R "${site_dir}/." .
          git add -A
          git commit -m "Build site from ${GITHUB_SHA}" || exit 0
          git push origin HEAD:gh-pages --force
