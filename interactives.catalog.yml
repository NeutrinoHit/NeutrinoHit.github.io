      note:
        ru: Нейтрино от сверхновой приходят вразнобой; правдоподобие превращает разброс в оценку массы — иногда отрицательную · «Введение в физику
          нейтрино», лекция 8
        en: Change the mass, the number of neutrinos and the emission spread; the slope of t vs 1/E² gives m² · Introduction to Neutrino Physics,
          lecture 8
      links:
      - kind: applet
        label:
          ru: Апплет
          en: Applet
        href: /neutrinophysics/introduction/ru/applets/sn-mass-likelihood.html
