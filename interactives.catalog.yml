          en: RU
        href: /neutrinophysics/oscillations-minicourse/en/slides/02_matter_sun.html#/refraction-layers
        href_en: /neutrinophysics/introduction/ru/applets/refraction-layers.html
    - id: np-refraction-two-modes
      title:
        ru: Две волны в веществе
        en: Two waves in matter
      note:
        ru: Как разность показателей преломления превращается в разность фаз и меняет вероятность флэйвора · «Введение в физику нейтрино», лекция
          11
        en: Set θ_m and the relative phase of the normal waves; see the projection onto the other flavour · Introduction to Neutrino Physics,
          lecture 11
      links:
      - kind: applet
        label:
          ru: Апплет
          en: Applet
        href: /neutrinophysics/introduction/ru/applets/refraction-two-modes.html
        href_en: /neutrinophysics/oscillations-minicourse/en/slides/02_matter_sun.html#/refraction-two-modes
      - kind: applet
