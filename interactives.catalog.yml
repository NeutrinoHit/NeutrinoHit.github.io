        href_en: /neutrinophysics/introduction/ru/applets/refraction-two-modes.html
    - id: np-matter-constant
      title:
        ru: Осцилляции в веществе постоянной плотности
        en: Oscillations at constant density
      note:
        ru: Амплитуда, период и MSW-резонанс при постоянной плотности вещества · «Введение в физику нейтрино», лекция 12
        en: 'Compare vacuum, resonance and high density: matter changes the envelope sin²2θ_m and the length L_m · Introduction to Neutrino Physics,
