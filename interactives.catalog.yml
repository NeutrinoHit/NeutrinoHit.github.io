  - id: mass
    title:
      ru: 'Масса нейтрино: β-распад, KATRIN, CRES'
      en: 'Neutrino mass: β decay, KATRIN, CRES'
    layout: stacked
    items:
    - id: np-fermi-function
      title:
        ru: Функция Ферми
        en: The Coulomb correction to the β spectrum
      note:
        ru: Как кулоновское поле ядра по-разному меняет β⁻- и β⁺-спектры · «Введение в физику нейтрино», лекция 4
        en: Change the charge of the daughter nucleus and compare β⁻ and β⁺ decays · Introduction to Neutrino Physics, lecture 4
      links:
      - kind: applet
        label:
          ru: Апплет
          en: Applet
        href: /neutrinophysics/introduction/ru/applets/fermi-function.html
    - id: np-mass-spectrum
      title:
        ru: Один β-спектр — несколько массовых порогов
        en: One β spectrum and several mass thresholds
      note:
        ru: Как несколько массовых состояний нейтрино проявляются у конца β-спектра · «Введение в физику нейтрино», лекция 4
        en: With good resolution each m_i would give its own kink; in a real experiment they merge into one distortion set by m_β · Introduction
          to Neutrino Physics, lecture 4
      links:
      - kind: applet
        label:
          ru: Апплет
          en: Applet
        href: /neutrinophysics/introduction/ru/applets/mass-spectrum.html
    - id: np-beta-endpoint-resolution
      title:
        ru: Конец β-спектра и энергетическое разрешение
        en: The neutrino mass and the energy resolution
      note:
        ru: Как масса нейтрино сдвигает конечную точку и как энергетическое разрешение размывает этот след · «Введение в физику нейтрино», лекция
          4
        en: Compares the true spectrum with the spectrum after Gaussian smearing near the endpoint · Introduction to Neutrino Physics, lecture
          4
      links:
      - kind: applet
        label:
          ru: Апплет
          en: Applet
        href: /neutrinophysics/introduction/ru/applets/beta-endpoint-resolution.html
    - id: np-katrin-integral-spectrum
      title:
        ru: Интегральный спектр KATRIN
        en: The integral spectrum of KATRIN
      note:
        ru: Как задерживающий потенциал отбирает электроны и превращает β-спектр в скорость счёта · «Введение в физику нейтрино», лекция 7
        en: The retarding potential sets the lower limit of the integral; points near the endpoint are most mass-sensitive · Introduction to Neutrino
          Physics, lecture 7
      links:
      - kind: applet
        label:
          ru: Апплет
          en: Applet
        href: /neutrinophysics/introduction/ru/applets/katrin-integral-spectrum.html
