# Interactives: applets, fits and games of the NeutrinoHit courses, lectures and talks.
# scripts/build_outreach_pages.py writes ru|en/interactives.qmd from this file. Only published, public pages
# (checked to answer 200): a standalone applet page or the slide that holds it. The first link opens the
# interactive (href on the Russian page, href_en on the English one); the second is the other language.
# An entry with lang: en exists in English only. The id is the anchor of the entry on the page.
interactives:
  topics: true
  title:
    ru: Интерактивы
    en: Interactives
  lead:
    ru: Апплеты, фиты и игры из курсов, лекций и докладов NeutrinoHit. Название открывает интерактив — отдельной страницей или в слайдах лекции;
      рядом версия на другом языке.
    en: Applets, fits and games from the courses, lectures and talks of NeutrinoHit. A title opens the interactive, on a page of its own or in
      the lecture slides; the version in the other language is next to it. Unmarked interactives are in Russian.
  groups:
  - id: oscillations
    title:
      ru: Осцилляции нейтрино
      en: Neutrino oscillations
    layout: stacked
    items:
    - id: np-two-flavor-oscillations
      title:
        ru: 'Осцилляции нейтрино: два флэйвора'
        en: A laboratory of two-flavour oscillations
      note:
        ru: Угол смешивания, разность масс и развитие квантового состояния · «Введение в физику нейтрино», лекция 9
        en: Change the mixing angle (amplitude) and the path in units of L_osc (phase) independently · Introduction to Neutrino Physics, lecture
          9
      links:
      - kind: applet
        label:
          ru: Апплет
          en: Applet
        href: /neutrinophysics/introduction/ru/applets/two-flavor-oscillations.html
        href_en: /neutrinophysics/oscillations-minicourse/en/slides/01_vacuum.html#/two-flavor-lab
      - kind: applet
        label:
          ru: EN
          en: RU
        href: /neutrinophysics/oscillations-minicourse/en/slides/01_vacuum.html#/two-flavor-lab
        href_en: /neutrinophysics/introduction/ru/applets/two-flavor-oscillations.html
    - id: np-flavor-triangle
      title:
        ru: Треугольник флэйворов
        en: Three flavour probabilities
      note:
        ru: 'Три вероятности в одном треугольнике: углы, CP-фаза, порядок масс и траектория по L/E · «Введение в физику нейтрино», лекция 10'
        en: A point in the triangle has barycentric coordinates (P_αe, P_αμ, P_ατ); change angles, δ_CP, ordering and L · Introduction to Neutrino
          Physics, lecture 10
      links:
      - kind: applet
        label:
          ru: Апплет
          en: Applet
        href: /neutrinophysics/introduction/ru/applets/flavor-triangle.html
        href_en: /neutrinophysics/oscillations-minicourse/en/slides/01_vacuum.html#/triangle
      - kind: applet
        label:
          ru: EN
          en: RU
        href: /neutrinophysics/oscillations-minicourse/en/slides/01_vacuum.html#/triangle
        href_en: /neutrinophysics/introduction/ru/applets/flavor-triangle.html
    - id: np-pmns-from-data
      title:
        ru: Соберите матрицу PMNS
        en: Build the PMNS matrix from measurements
      note:
        ru: Солнечный дефицит, атмосферное исчезновение, реакторная поправка и унитарность заполняют матрицу по шагам · «Введение в физику нейтрино»,
          лекция 10
        en: Solar deficit, atmospheric disappearance and normalization fill the approximate mixing matrix step by step · Introduction to Neutrino
          Physics, lecture 10
      links:
      - kind: applet
        label:
          ru: Апплет
          en: Applet
        href: /neutrinophysics/introduction/ru/applets/pmns-from-data.html
    - id: np-three-flavor-probabilities
      title:
        ru: Вероятности осцилляций трёх нейтрино
        en: Explore three-flavor probabilities
      note:
        ru: 'Калькулятор: нейтрино и антинейтрино в вакууме как функции E и L, порядок масс, сравнение кривых, карта (L, E) · «Введение в физику
          нейтрино», лекция 10'
        en: 'Калькулятор: нейтрино и антинейтрино в вакууме как функции E и L, порядок масс, сравнение кривых, карта (L, E) · Introduction to
          Neutrino Physics, lecture 10'
      links:
      - kind: applet
        label:
          ru: Апплет
          en: Applet
        href: /neutrinophysics/introduction/ru/applets/three-flavor-probabilities.html
        href_en: /neutrinophysics/oscillations-minicourse/en/slides/01_vacuum.html#/three-flavor-probabilities
      - kind: applet
        label:
          ru: EN
          en: RU
        href: /neutrinophysics/oscillations-minicourse/en/slides/01_vacuum.html#/three-flavor-probabilities
        href_en: /neutrinophysics/introduction/ru/applets/three-flavor-probabilities.html
    - id: np-refraction-layers
      title:
        ru: Тонкий слой и показатель преломления
        en: A thin layer and the accumulated phase
      note:
        ru: Один слой почти не меняет волну; в однородной среде малые сдвиги фазы накапливаются · «Введение в физику нейтрино», лекция 11
        en: 'Change the refractive index and thickness: the wavelength returns to vacuum value, the accumulated phase remains · Introduction to
          Neutrino Physics, lecture 11'
      links:
      - kind: applet
        label:
          ru: Апплет
          en: Applet
        href: /neutrinophysics/introduction/ru/applets/refraction-layers.html
        href_en: /neutrinophysics/oscillations-minicourse/en/slides/02_matter_sun.html#/refraction-layers
      - kind: applet
        label:
