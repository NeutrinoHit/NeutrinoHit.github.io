# Modeling: software, physical models and the animation gallery. scripts/build_outreach_pages.py
# writes ru|en/modeling.qmd from this file (entries, links and formats as in outreach.catalog.yml).
# A group with "install" shows the install command under its head. A tile with "gallery: <section id>"
# opens that section of the animation gallery; its counts, text and picture come from animations.catalog.json.
# Only public repositories are linked (dvnanima, two_pendulums and bits-of-physics are private).
modeling:
  title: {ru: Моделирование, en: Modeling}
  lead: {ru: 'Программы, физические модели и научные анимации. Название открывает материал, рядом — другие ссылки.',
    en: 'Software, physical models and scientific animations. A title opens the material; the other links are next to it.'}
  groups:
  - id: lighthit
    kind: {ru: Пакет Python · PyPI, en: Python package · PyPI}
    title: LightHit
    summary: {ru: 'Ожидаемое число фотоэлектронов в каждом оптическом модуле нейтринного телескопа по временным бинам от черенковского света заряженных частиц или калибровочной вспышки. Спектральный перенос излучения в рассеивающей среде вместо пофотонного Монте-Карло; прямой, однократно и многократно рассеянный свет считаются отдельно.',
      en: 'The expected number of photoelectrons that Cherenkov light of charged particles, or a calibration flash, produces in every optical module of a neutrino telescope, per time bin. Spectral radiative transfer in a scattering medium instead of photon-by-photon Monte Carlo; direct, once-scattered and multiply scattered light are kept separate.'}
    install: "python -m pip install 'lighthit[accelerate]'"
    install_note: {ru: 'Python 3.11 или новее; проверка установки — lighthit-selftest', en: 'Python 3.11 or newer; check the installation with lighthit-selftest'}
    links:
    - {kind: pypi, href: 'https://pypi.org/project/lighthit/'}
    - {kind: docs, href: 'https://github.com/NeutrinoHit/LightHit/tree/main/docs'}
    - {kind: code, href: 'https://github.com/NeutrinoHit/LightHit'}
  - id: animations
    kind: {ru: Галерея, en: Gallery}
    title: {ru: Анимации, en: Animations}
    summary: {ru: 'Научные анимации по темам; ролик открывается прямо на странице галереи.', en: 'Scientific animations by topic; a video plays right on the gallery page.'}
    links:
    - {kind: page, label: {ru: Вся галерея, en: The whole gallery}, href: /ru/animations.html, href_en: /en/animations.html}
    tiles:
    - {gallery: neutrino-particles, cover: milky-way-neutrinos/milky-way-neutrinos}
    - {gallery: fields-waves}
    - {gallery: relativity-atom-spin}
    - {gallery: math-dynamical-systems}
    - {gallery: accelerator-optics}
    - {gallery: visual-stories, cover: galaxy-merger/merger}
  - id: physical-models
    kind: {ru: Код, en: Code}
    title: {ru: Физические модели, en: Physical models}
    items:
    - title: TDSE-Diffraction
      note: {ru: 'дифракция электронов: метод split-step Фурье в единицах СИ, вихревые пучки, ноутбуки с анимациями', en: 'electron diffraction: split-step Fourier method in SI units, vortex beams, notebooks with animations'}
      links: [{kind: code, href: 'https://github.com/NeutrinoHit/TDSE-Diffraction'}]
    - title: neutrino-nucleus-coherence
      note: {ru: 'сечение упругого рассеяния нейтрино на ядре, ноутбук Jupyter', en: 'the cross-section of neutrino–nucleus elastic scattering, a Jupyter notebook'}
      links: [{kind: code, href: 'https://github.com/NeutrinoHit/neutrino-nucleus-coherence'}]
  - id: tools
    kind: {ru: Код, en: Code}
    title: {ru: Инструменты, en: Tools}
    items:
    - title: gTracker
      note: {ru: 'анимированная карта заявок по городам и датам из таблицы, экспорт в GIF и MP4', en: 'an animated map of applications by city and date from a table, exported as GIF and MP4'}
      links: [{kind: code, href: 'https://github.com/NeutrinoHit/gTracker'}]
