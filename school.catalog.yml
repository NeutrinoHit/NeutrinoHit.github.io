      pdf: /students/theses/kovalev.pdf
    - year: 2026
      category: phd
      name:
        ru: Аллахвердян Владимир Артурович
        en: Vladimir A. Allakhverdyan
      work:
        ru: Решение задач переноса электромагнитного излучения и нейтрино при моделировании отклика нейтринного телескопа.
        en: Transport of electromagnetic radiation and neutrinos in modeling the response of a neutrino telescope.
      pdf: /students/theses/allaxwerdian.pdf
    - year: 2026
      category: master
      name:
        ru: Бородин Никита Святославович
        en: Nikita S. Borodin
      work:
        ru: Спин-орбитальные эффекты в распадах (псевдо)скалярных частиц и дифракция закрученных квантовых состояний.
        en: Spin-orbit effects in decays of (pseudo)scalar particles and diffraction of twisted quantum states.
      pdf: /students/theses/Borodin_dissertation.pdf
